<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모바일 화면 확인</title><style>*{box-sizing:border-box}body{margin:0;background:#e7ebe1;color:#35472d;font:15px/1.5 system-ui,sans-serif}header{display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap;padding:18px}button,select,a{padding:10px 15px;border:1px solid #d3dbc9;background:#fff;border-radius:9px;color:inherit;font:inherit;text-decoration:none;cursor:pointer}main{display:flex;justify-content:center;padding:10px 20px 40px}iframe{border:1px solid #cbd4c0;border-radius:22px;background:#fff;box-shadow:0 12px 40px #354a2520;height:812px;width:375px;max-width:100%;resize:both}p{text-align:center;font-size:13px;color:#7a8c6b}</style><header><a href="/admin">전체 화면</a><button id="student">학생용</button><button id="admin">강사용</button><label>화면 폭 <select id="width"><option>375</option><option>390</option><option>430</option></select></label></header><p>각 휴대폰 폭에서 실제 화면 배치를 확인합니다.</p><main><iframe id="phone" title="휴대폰 화면" src="/s"></iframe></main><script>const phone=document.querySelector('#phone');document.querySelector('#student').onclick=()=>phone.src='/s';document.querySelector('#admin').onclick=()=>phone.src='/admin';document.querySelector('#width').onchange=ev=>phone.style.width=ev.target.value+'px';</script></html>
